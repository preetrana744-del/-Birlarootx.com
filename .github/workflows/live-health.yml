name: Live storefront health
on:
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'
permissions:
  contents: read
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Read-only storefront and backend probes
        run: node scripts/check-live-health.mjs
